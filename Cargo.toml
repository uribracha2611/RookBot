[package]
name = "RookBot"
version = "0.1.0"
edition = "2024"


[dependencies]


num-traits = "0.2.19"


derive_more = { version = "2.1.1", features = ["add", "not", "add_assign", "mul"] }
const_for = "0.1.5"
clap = { version = "4.5.60", features = ["derive"] }
rand = "0.10.0"
chrono = "0.4.44"
[profile.perf]
inherits = "release"
debug = true
lto = false
codegen-units = 1
[profile.debug-no-assert]
inherits = "dev"
debug-assertions = false
